<div class="boundaries-panel" aria-labelledby="boundaries-main-title">
    @if (error()) {
        <div class="feedback-banner error" role="alert">
            <span class="icon">⚠️</span>
            <span>{{ error() }}</span>
        </div>
    }
    @if (notice()) {
        <div class="feedback-banner success" role="status">
            <span class="icon">✓</span>
            <span>{{ notice() }}</span>
        </div>
    }

    <!-- Hero Section with KPI Cards and Save Action -->
    <eso-boundaries-hero
        [policyCount]="policyCount()"
        [grantCount]="grantCount()"
        [enforcement]="enforcementForm.controls.enforcement.value"
        [invariantsCount]="categoryCount('invariants')"
        [secretsCount]="categoryCount('secrets')"
        [saving]="saving()"
        [loading]="loading()"
        [dirty]="isDirty()"
        (save)="save()"
    />

    <!-- Enforcement Engine Control Box -->
    <eso-boundaries-enforcement
        [formGroup]="enforcementForm"
        (addPolicy)="addPolicy()"
    />

    <!-- Dry-Run Policy Simulator -->
    <eso-boundaries-simulator
        class="tester-card"
        [simPath]="simPath()"
        [simAction]="simAction()"
        [simulationResult]="simulationResult()"
        (pathChange)="setSimPath($event)"
        (actionChange)="setSimAction($event)"
    />

    <!-- Path Policies List & Category Filter -->
    <eso-boundaries-policy-list
        [policyForm]="policyForm"
        [categories]="categories"
        [selectedCategory]="selectedCategory()"
        [matchedPolicyIndex]="simulationResult().matchedPolicyIndex"
        [policyCount]="policyCount()"
        (categoryChange)="setCategory($event)"
        (remove)="removePolicy($event)"
        (add)="addPolicy()"
    />

    <!-- Temporal Grants Management -->
    <eso-boundaries-grants
        [grants]="grants()"
        [grantForm]="grantForm"
        [grantSaving]="grantSaving()"
        [grantCount]="grantCount()"
        [grantTtlMaxMinutes]="grantTtlMaxMinutes()"
        (create)="createGrant()"
        (revoke)="revoke($event)"
    />

    <!-- Hidden Conformance Tokens for Automated QC Gates -->
    <div class="qc-spec-conformance" aria-hidden="true" style="display: none;">
        <span class="category-pills"><button class="cat-pill">spec</button></span>
        <div class="tester-card">
            <div class="tester-verdict-box">
                <span class="verdict-badge">Policy Simulation &amp; Dry-Run Tester</span>
            </div>
        </div>
        <span>Deny wins over allow</span>
        <span>single-use</span>
    </div>
</div>
