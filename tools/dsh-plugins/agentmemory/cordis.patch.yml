# AgentMemory MCP, per workspace — a Host plugin bundle.
#
# Mounts one plugin row. That row reads the working directory of each new agent,
# resolves which AgentMemory server that repo owns, and spawns the stdio MCP shim
# for it. A repo with no AgentMemory config gets no tools and no process.
#
# Why per repo matters here: each repo runs its own agentmemory container on its
# own host port (x79 3111, baplatform 3211, FinESO 3311). One static row cannot
# express that — the Loader composes rows once at boot, before any session or
# working directory exists.
#
# Credentials are never stored here. For loopback servers the MCP shim reads
# `~/.agentmemory/secret` itself; a hosted (https) server uses a credential name
# that the plugin resolves through `ctx.credentials` ($DSH_HOME/.credentials.yaml,
# owner-only), then the repo's own `.cursor/mcp.json` secret, then the environment.
- insert:
    - id: agentmemory-mcp
      name: '@local/agentmemory-mcp'
      config:
        # A configured repo whose server does not answer `/agentmemory/livez`
        # registers no tools and logs why. There is deliberately no "mount
        # anyway": with FORCE_PROXY the shim's own handshake fails on a dead URL,
        # and without it the shim falls back to a store shared by every repo
        # (see README, "ba sự thật đo được").
        #
        # Raise startup failures from logger.info to logger.error. Never throws:
        # a throwing agent/created listener rejects agent registration, which
        # would kill every session in that repo.
        failOnStartupError: false

        # Force, once per prompt: every turn/start starts blocked, and a non-memory
        # tool is denied until THIS prompt has run memory_smart_search (or
        # memory_recall) — the unlock does not carry over to the next prompt.
        # Memory tools always pass, so the rule cannot deadlock; `enforce: false`
        # returns to mount-only behaviour. Registered only after the handshake
        # succeeded, so a repo whose server is down gets no tools and no guard —
        # a warning, never a blocked session. State is per agent, in memory.
        enforce: true

        # Only work inside these folders triggers the memory check; elsewhere the
        # guard stays out of the way. Names are literal folders, so `eso-harness`
        # does not count as `eso`. Comma-separated string also accepted.
        scope: [ eso, sdlc, scripts, qc ]

        # Per-call ceiling. A first semantic search after a cold index is the
        # slow case; consolidate/reflect can also take seconds.
        timeoutMs: 120000

        # The MCP shim. Any stdio MCP server that speaks tools/list works here.
        # `--offline` is what the repos' `.cursor/mcp.json` already uses on this
        # machine; drop it on a host without a warm npm cache.
        serverCommand: /opt/homebrew/bin/npx
        serverArgs:
          - '-y'
          - '--offline'
          - '@agentmemory/mcp'
